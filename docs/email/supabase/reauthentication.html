<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#f0f0f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111114">
  <span style="display:none;visibility:hidden;opacity:0;height:0;width:0;overflow:hidden">Your Whetstone verification code.</span>

        <tr><td style="padding:22px 28px;border-bottom:1px solid #e5e5e8">

        <tr><td style="padding:28px">

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:15px;line-height:1.6;color:#6b7280">
            <tr><td style="padding-bottom:16px">

            </td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:20px 28px;border-top:1px solid #e5e5e8;font-size:12px;color:#6b7280">
          Verified, insured, bounded advisory sessions.<br>
          If you didn&#39;t request this, you can safely ignore this email.
        </td></tr>

</html>

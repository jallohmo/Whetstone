name: Automated Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run full E2E suite nightly at 2 AM UTC
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # STAGE 1: LINT & TYPE CHECK (Fast - runs on every push)
  # ============================================================================
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

  # ============================================================================
  # STAGE 2: UNIT & INTEGRATION TESTS (Fast - 2-5 min)
  # ============================================================================
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-type

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.node-version }}
          path: coverage/

  # ============================================================================
  # STAGE 3: BUILD (Ensure build succeeds)
  # ============================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint-and-type

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/

  # ============================================================================
  # STAGE 4: E2E TESTS (Runs on PR merge to main + nightly schedule)
  # ============================================================================
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # Only run on main branch or scheduled events (skip on every PR for speed)
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [unit-tests, build]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Build only. Playwright's own `webServer` block starts `npm run start` and
      # waits for it to answer — starting a second server here would collide with
      # it on port 3000, because reuseExistingServer is false under CI.
      #
      # NEXT_PUBLIC_* are inlined at BUILD time, so the Supabase browser client
      # only works in the signed-in spec if they are present here, not merely at
      # run time. With the secrets unset the build still succeeds and that spec
      # skips itself.
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: 'http://localhost:3000'
          # Only the signed-in checkout spec needs these. Without them it skips
          # and the anonymous funnel suite runs exactly as before.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          INSURANCE_COVERAGE_ACTIVE: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Comment PR with E2E results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'playwright-report/index.html';
            if (fs.existsSync(reportPath)) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ E2E tests passed! [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
              });
            }

  # ============================================================================
  # STAGE 5: PERFORMANCE TESTS (Lighthouse CI - runs on main)
  # ============================================================================
  performance:
    name: Performance (Lighthouse CI)
    runs-on: ubuntu-latest
    # Nightly/manual only. These thresholds have never been measured against
    # real infrastructure, so they report quality signals rather than gate
    # merges to main. Promote back to push-on-main once the numbers are known.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ============================================================================
  # STAGE 6: SECURITY SCANNING (Snyk - runs on all branches)
  # ============================================================================
  security:
    name: Security Scan (Snyk)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

      - name: Upload Snyk results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

  # ============================================================================
  # STAGE 7: ACCESSIBILITY AUDIT (Pa11y - runs on main)
  # ============================================================================
  accessibility:
    name: Accessibility Audit (Pa11y)
    runs-on: ubuntu-latest
    # Nightly/manual only. These thresholds have never been measured against
    # real infrastructure, so they report quality signals rather than gate
    # merges to main. Promote back to push-on-main once the numbers are known.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: npm start &

      - name: Wait for server
        run: sleep 10

      - name: Run Pa11y CI
        run: npx pa11y-ci --config .pa11yci.json
        continue-on-error: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-results
          path: pa11y-ci-results.json

  # ============================================================================
  # FINAL: STATUS CHECK
  # ============================================================================
  test-status:
    name: Test Status
    runs-on: ubuntu-latest
    needs: [lint-and-type, unit-tests, build]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.lint-and-type.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Tests failed!"
            exit 1
          fi
          echo "✅ All checks passed!"

      - name: Notify Slack (optional)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Tests failed in ${{ github.ref }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
